---
version: '3'

tasks:
  default:
    cmds:
      - task: format
      - task: lint_and_test

  lint_and_test:
    deps: [lint, test]

  format:
    cmds:
      - ruff format --respect-gitignore
      - ruff check --fix
      - task: format:md
      - task: format:toml

  format:md:
    cmds:
      - pnpm exec markdownlint-cli2 --fix

  format:toml:
    cmds:
      - taplo format *.toml

  lint:
    deps: [lint_yaml, lint_shell, lint_ruff_format, lint_ruff_check, lint:md, lint:pyright, lint:toml, lint_typos]

  lint:md:
    cmds:
      - pnpm exec markdownlint-cli2

  lint:pyright:
    cmds:
      - pnpm exec pyright

  lint:toml:
    cmds:
      - taplo format --check *.toml

  lint_yaml:
    cmds:
      - >-
        find . \( -name node_modules -o -name .venv \) \
         -prune -o -type f \( -name "*.yaml" -o -name "*.yml" \) -print \
        | xargs yamllint

  lint_shell:
    cmds:
      - >-
        find . \( -name node_modules -o -name .venv \) \
          -prune -o -type f -name '*.sh' -print \
        | xargs shellcheck
  lint_ruff_format:
    cmds:
      - ruff format --respect-gitignore --check

  lint_ruff_check:
    cmds:
      - ruff check --respect-gitignore

  lint_typos:
    cmds:
      - typos -V && typos

  test:
    cmds:
      - ':'
